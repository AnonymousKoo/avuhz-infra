name: DEVELOPMENT AUTH Recovery Shape Diagnostic v2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSPECT_DEVELOPMENT_AUTH_RECOVERY_SHAPE_V2_ONCE for the exact diagnostic attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: development-auth-recovery-shape-diagnostic-v2
  cancel-in-progress: false

jobs:
  inspect-recovery-verification-shape:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: development

    env:
      AVUHZ_EXPECTED_PROJECT_REF: pwlhruwutoitnieactol
      AVUHZ_PLAN_ID: 750bb51d-91c0-4d49-9584-d8d37081c46a
      AVUHZ_PLAN_DIGEST: sha256:c66c6d7e805b50042c911f25829b523a47d149815fed5231d84ca0d817d03875
      AVUHZ_APPROVAL_ID: ee05121f-ef52-4eea-bc6c-4e6487b50fc7
      AVUHZ_APPROVAL_DIGEST: sha256:a95fd89aa71d7e017ab153fac29be1b735c0e91e4c6c70cf6cbea85fb7bf34d3
      AVUHZ_WINDOW_START: '2026-09-28T01:00:00Z'
      AVUHZ_WINDOW_END: '2026-09-28T07:00:00Z'
      AVUHZ_RECOVERY_SHAPE_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify main-only dispatch and exact diagnostic binding
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::RECOVERY_SHAPE_DIAGNOSTIC_V2_MAIN_ONLY"
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "::error::RECOVERY_SHAPE_DIAGNOSTIC_V2_REPLAY_PROHIBITED"
            exit 1
          fi
          if [[ "${AVUHZ_RECOVERY_SHAPE_DIAGNOSTIC_CONFIRMATION}" != "INSPECT_DEVELOPMENT_AUTH_RECOVERY_SHAPE_V2_ONCE" ]]; then
            echo "::error::RECOVERY_SHAPE_DIAGNOSTIC_V2_CONFIRMATION_MISMATCH"
            exit 1
          fi
          if [[ "${AVUHZ_EXPECTED_PROJECT_REF}" != "pwlhruwutoitnieactol" ]] \
             || [[ "${AVUHZ_PLAN_ID}" != "750bb51d-91c0-4d49-9584-d8d37081c46a" ]] \
             || [[ "${AVUHZ_PLAN_DIGEST}" != "sha256:c66c6d7e805b50042c911f25829b523a47d149815fed5231d84ca0d817d03875" ]] \
             || [[ "${AVUHZ_APPROVAL_ID}" != "ee05121f-ef52-4eea-bc6c-4e6487b50fc7" ]] \
             || [[ "${AVUHZ_APPROVAL_DIGEST}" != "sha256:a95fd89aa71d7e017ab153fac29be1b735c0e91e4c6c70cf6cbea85fb7bf34d3" ]] \
             || [[ "${AVUHZ_WINDOW_START}" != "2026-09-28T01:00:00Z" ]] \
             || [[ "${AVUHZ_WINDOW_END}" != "2026-09-28T07:00:00Z" ]]; then
            echo "::error::RECOVERY_SHAPE_DIAGNOSTIC_V2_PLAN_BINDING_MISMATCH"
            exit 1
          fi
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "${AVUHZ_WINDOW_START}" +%s)"
          end_epoch="$(date -u -d "${AVUHZ_WINDOW_END}" +%s)"
          if (( now_epoch < start_epoch || now_epoch >= end_epoch )); then
            echo "::error::RECOVERY_SHAPE_DIAGNOSTIC_V2_AUTHORIZATION_WINDOW_INACTIVE"
            exit 1
          fi

      - name: Install pinned authorization dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.10.3'

      - name: Validate exact authority before secret resolution
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          PYTHONPATH=src:. python3 scripts/development_auth_recovery_verification_shape_diagnostic_v2.py --preflight-only

      - name: Execute exact diagnostic once
        shell: bash
        env:
          AVUHZ_DEVELOPMENT_AUTH_RECOVERY_SHAPE_DIAGNOSTIC_V2_ADMIN_EPHEMERAL: ${{ secrets.AVUHZ_DEVELOPMENT_AUTH_RECOVERY_SHAPE_DIAGNOSTIC_V2_ADMIN_EPHEMERAL }}
          AVUHZ_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AVUHZ_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          PYTHONPATH=src:. python3 scripts/development_auth_recovery_verification_shape_diagnostic_v2.py
