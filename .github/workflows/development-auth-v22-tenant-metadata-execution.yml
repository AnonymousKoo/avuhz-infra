name: DEVELOPMENT AUTH v22 Tenant Metadata Execution

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type EXECUTE_V22_TENANT_METADATA to authorize this exact bounded run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: development-auth-v22-tenant-metadata-execution
  cancel-in-progress: false

jobs:
  execute-development-auth-v22-tenant-metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development

    env:
      AVUHZ_PROJECT_REF: pwlhruwutoitnieactol
      AVUHZ_PLAN_ID: 9dec1b7c-198b-4590-9750-80e68106db98
      AVUHZ_PLAN_VERSION: '22'
      AVUHZ_PLAN_DIGEST: sha256:d45d82a3fe6ff702044b2f976178f947e2db8399da08c3f7d5f6931612ddbd9d
      AVUHZ_APPROVAL_ID: 992dfd16-6f9d-4f39-8c56-a53b7e3a1094
      AVUHZ_APPROVAL_DIGEST: sha256:28726aa2424ca8436088ac9530642416c56e045a8e2fff2b0ca9897499bfa3d5
      AVUHZ_WINDOW_START: '2026-09-14T19:30:00Z'
      AVUHZ_WINDOW_END: '2026-09-14T22:30:00Z'
      AVUHZ_TARGET_EMAIL: avuhz-development-synthetic@example.invalid
      AVUHZ_TENANT_ID: 1ad3998c-92ab-4a36-9d1c-ed97f2fa98f0
      AVUHZ_SUBJECT_DIGEST: sha256:96ed2639ff64f1c0712d9548f8d524c4cd7f3025d30013c8857aace8661a84a5
      AVUHZ_TARGET_APP_METADATA_DIGEST: sha256:cd89c12abf5ed8c3dc03f4766a6d7cd9f1b8388b9e98468e9673233550a910a6
      AVUHZ_V21_SUCCESS_RAW_DIGEST: sha256:16fbd6f2b1b779a4879f9eca7b5469267822884740dab7a02d3a0f8c7211fffa
      AVUHZ_V16_SUCCESS_RAW_DIGEST: sha256:0cfa1a3515e6496e9bc215de4579d5e4ff5b46f0299227b60708dc72ff2fb194
      AVUHZ_CAPABILITY_RUN_ID: '34895225473'
      AVUHZ_CAPABILITY_HEAD_SHA: 58437583f582d10f184f987c023b9536cc32012f
      AVUHZ_CAPABILITY_EVIDENCE_DIGEST: sha256:6f0d17815581401b01bf60a296fc79381141d7747b4f13d57acd1055f17b5160
      AVUHZ_CAPABILITY_EVIDENCE_RAW_DIGEST: sha256:8cee24d2802a06982c00ad12fb14ebd130ef8b1a6b9547989df6fb522e1ea719
      AVUHZ_CAPABILITY_REFERENCE_DIGEST: sha256:ed3be015f92dd36839403f24ac31cded47a9521f85643a1a1cf7f1382c103d50
      AVUHZ_PREFLIGHT_REFERENCE_DIGEST: sha256:372355dfe9257db6670b0a64109933a1b738ddfb980f6d5a9a72a344f8a48184
      AVUHZ_EXECUTION_REFERENCE_DIGEST: sha256:692e4cdf332ca728a392c63442153ad78e0137c1a3a65df1c40c45d565876588
      SUPABASE_AUTH_ADMIN_EPHEMERAL: ${{ secrets.AVUHZ_DEVELOPMENT_SUPABASE_AUTH_ADMIN_EPHEMERAL }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable v22 authority and repository evidence
        shell: bash
        env:
          AVUHZ_DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::DEVELOPMENT AUTH v22 execution is allowed only from main."
            exit 1
          fi

          if [[ "${AVUHZ_DISPATCH_CONFIRMATION}" != "EXECUTE_V22_TENANT_METADATA" ]]; then
            echo "::error::Exact v22 execution confirmation was not supplied."
            exit 1
          fi

          if [[ -z "${SUPABASE_AUTH_ADMIN_EPHEMERAL:-}" ]]; then
            echo "::error::Required DEVELOPMENT Auth-admin ephemeral secret is unavailable."
            exit 1
          fi

          if [[ "${SUPABASE_AUTH_ADMIN_EPHEMERAL}" != sb_secret_* ]]; then
            echo "::error::DEVELOPMENT Auth-admin execution requires the dedicated modern Supabase secret key."
            exit 1
          fi

          now_epoch="$(date -u +%s)"
          window_start_epoch="$(date -u -d "${AVUHZ_WINDOW_START}" +%s)"
          window_end_epoch="$(date -u -d "${AVUHZ_WINDOW_END}" +%s)"
          if (( now_epoch < window_start_epoch || now_epoch >= window_end_epoch )); then
            echo "::error::DEVELOPMENT AUTH v22 authorization window is not active."
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = Path("contracts/plans/v1")
          plan_path = base / "development-auth-integration-v22.plan.json"
          approval_path = base / "development-auth-integration-v22.approval.json"
          progress_path = base / "development-auth-integration-v22.progress.json"
          capability_path = base / "development-auth-v22-admin-capability.evidence.json"
          v21_path = base / "development-auth-step1-v21-success.evidence.json"
          v16_path = base / "development-auth-step1-v16-success.evidence.json"

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def raw_digest(path):
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical_digest(value):
              payload = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              return "sha256:" + hashlib.sha256(payload).hexdigest()

          plan = load(plan_path)
          approval = load(approval_path)
          progress = load(progress_path)
          capability = load(capability_path)
          v21 = load(v21_path)
          v16 = load(v16_path)

          if plan.get("plan_id") != os.environ["AVUHZ_PLAN_ID"]:
              raise SystemExit("v22 plan ID mismatch")
          if str(plan.get("plan_version")) != os.environ["AVUHZ_PLAN_VERSION"]:
              raise SystemExit("v22 plan version mismatch")
          if plan.get("plan_digest") != os.environ["AVUHZ_PLAN_DIGEST"]:
              raise SystemExit("v22 plan digest mismatch")
          target = plan.get("target", {})
          if target.get("provider_reference") != "supabase":
              raise SystemExit("v22 provider mismatch")
          if target.get("responsibility") != "AUTH":
              raise SystemExit("v22 responsibility mismatch")
          if target.get("project_reference") != os.environ["AVUHZ_PROJECT_REF"]:
              raise SystemExit("v22 project mismatch")

          window = plan.get("authorization_window", {})
          if window != {
              "binding_state": "BOUND",
              "starts_at": os.environ["AVUHZ_WINDOW_START"],
              "expires_at": os.environ["AVUHZ_WINDOW_END"],
          }:
              raise SystemExit("v22 authorization window mismatch")

          if approval.get("approval_id") != os.environ["AVUHZ_APPROVAL_ID"]:
              raise SystemExit("v22 approval ID mismatch")
          if approval.get("plan_id") != os.environ["AVUHZ_PLAN_ID"]:
              raise SystemExit("v22 approval plan mismatch")
          if approval.get("plan_digest") != os.environ["AVUHZ_PLAN_DIGEST"]:
              raise SystemExit("v22 approval plan digest mismatch")
          if approval.get("approval_digest") != os.environ["AVUHZ_APPROVAL_DIGEST"]:
              raise SystemExit("v22 approval digest mismatch")
          if approval.get("decision") != "APPROVE" or approval.get("status") != "ACTIVE":
              raise SystemExit("v22 approval is not active APPROVE")
          if approval.get("environment") != "DEVELOPMENT":
              raise SystemExit("v22 approval environment mismatch")
          if approval.get("effective_at") != os.environ["AVUHZ_WINDOW_START"]:
              raise SystemExit("v22 approval effective time mismatch")
          if approval.get("expires_at") != os.environ["AVUHZ_WINDOW_END"]:
              raise SystemExit("v22 approval expiry mismatch")
          if approval.get("authority_scope") != "EXACT_PLAN_ONLY":
              raise SystemExit("v22 approval scope mismatch")

          if progress.get("plan_id") != os.environ["AVUHZ_PLAN_ID"]:
              raise SystemExit("v22 progress plan mismatch")
          if progress.get("overall_state") != "NOT_STARTED":
              raise SystemExit("v22 progress is not pristine")
          states = progress.get("step_states")
          if not isinstance(states, list) or len(states) != 1:
              raise SystemExit("v22 progress step shape mismatch")
          state = states[0]
          if state.get("step_id") != "development.auth.v22.step.01.bind-synthetic-tenant-app-metadata":
              raise SystemExit("v22 progress step mismatch")
          if state.get("authorization_state") != "PENDING":
              raise SystemExit("v22 authorization state is not pristine")
          if state.get("execution_state") != "NOT_STARTED":
              raise SystemExit("v22 execution state is not pristine")
          if state.get("authorization_consumed") is not False:
              raise SystemExit("v22 authorization is already consumed")
          if state.get("evidence") != [] or state.get("binding_assertions") != []:
              raise SystemExit("v22 progress contains unexpected execution state")

          steps = plan.get("steps")
          if not isinstance(steps, list) or len(steps) != 1:
              raise SystemExit("v22 plan step shape mismatch")
          step = steps[0]
          if step.get("step_id") != "development.auth.v22.step.01.bind-synthetic-tenant-app-metadata":
              raise SystemExit("v22 step ID mismatch")
          if step.get("operation") != "provider.auth-identity.app-metadata.bind-one":
              raise SystemExit("v22 operation mismatch")
          if step.get("execution_class") != "PROVIDER_MUTATION":
              raise SystemExit("v22 execution class mismatch")
          policy = step.get("credential_policy", {})
          if policy.get("allowed_classes") != ["SUPABASE_AUTH_ADMIN_EPHEMERAL"]:
              raise SystemExit("v22 credential class mismatch")
          if policy.get("values_stored") is not False:
              raise SystemExit("v22 credential storage policy mismatch")

          declarations = {
              item.get("binding_id"): item
              for item in step.get("binding_declarations", [])
          }
          subject = declarations.get("binding.development.auth.v22.synthetic-subject-digest", {})
          tenant = declarations.get("binding.development.auth.v22.canonical-tenant", {})
          metadata = declarations.get("binding.development.auth.v22.target-app-metadata", {})
          capability_binding = declarations.get("binding.development.auth.v22.admin-executor-capability", {})
          preflight_binding = declarations.get("binding.development.auth.v22.tenant-metadata-preflight", {})
          produced_binding = declarations.get("binding.development.auth.v22.tenant-metadata", {})

          if subject.get("preapproval_value", {}).get("value") != os.environ["AVUHZ_SUBJECT_DIGEST"]:
              raise SystemExit("v22 subject digest binding mismatch")
          if tenant.get("preapproval_value", {}).get("value") != os.environ["AVUHZ_TENANT_ID"]:
              raise SystemExit("v22 tenant binding mismatch")
          if metadata.get("preapproval_value", {}).get("value") != os.environ["AVUHZ_TARGET_APP_METADATA_DIGEST"]:
              raise SystemExit("v22 target metadata binding mismatch")
          if capability_binding.get("evidence_type") != "auth.admin-executor-capability.observed":
              raise SystemExit("v22 capability binding mismatch")
          if preflight_binding.get("evidence_type") != "auth.synthetic-identity.tenant-metadata-preflight.observed":
              raise SystemExit("v22 preflight binding mismatch")
          if produced_binding.get("evidence_type") != "auth.synthetic-identity.tenant-metadata.bound":
              raise SystemExit("v22 produced binding mismatch")

          if raw_digest(v21_path) != os.environ["AVUHZ_V21_SUCCESS_RAW_DIGEST"]:
              raise SystemExit("v21 success evidence digest mismatch")
          if v21.get("outcome") != "SUCCEEDED_VERIFIED":
              raise SystemExit("v21 success evidence outcome mismatch")
          provider = v21.get("provider_observation", {})
          if provider.get("auth_user_count") != 1:
              raise SystemExit("v21 synthetic identity count mismatch")
          if provider.get("synthetic_identity_match_count") != 1:
              raise SystemExit("v21 synthetic identity match mismatch")
          if provider.get("synthetic_subject_digest") != os.environ["AVUHZ_SUBJECT_DIGEST"]:
              raise SystemExit("v21 synthetic subject digest mismatch")
          if provider.get("synthetic_email_confirmed") is not True:
              raise SystemExit("v21 synthetic email confirmation mismatch")
          if provider.get("app_metadata_exact_provider_shape") is not True:
              raise SystemExit("v21 app metadata baseline mismatch")
          if provider.get("session_count") != 0 or provider.get("refresh_token_count") != 0:
              raise SystemExit("v21 session baseline mismatch")

          if raw_digest(v16_path) != os.environ["AVUHZ_V16_SUCCESS_RAW_DIGEST"]:
              raise SystemExit("v16 disabled-hook evidence digest mismatch")
          if v16.get("outcome") != "SUCCEEDED_VERIFIED":
              raise SystemExit("v16 disabled-hook evidence outcome mismatch")
          if v16.get("hosted_auth_observation", {}).get("custom_access_token_hook_enabled") is not False:
              raise SystemExit("v16 hook baseline mismatch")

          if raw_digest(capability_path) != os.environ["AVUHZ_CAPABILITY_EVIDENCE_RAW_DIGEST"]:
              raise SystemExit("v22 capability evidence raw digest mismatch")
          if capability.get("evidence_type") != "auth.admin-executor-capability.observed":
              raise SystemExit("v22 capability evidence type mismatch")
          if capability.get("observation_only") is not True:
              raise SystemExit("v22 capability evidence is not observation-only")
          if capability.get("plan_id") != os.environ["AVUHZ_PLAN_ID"] or str(capability.get("plan_version")) != os.environ["AVUHZ_PLAN_VERSION"]:
              raise SystemExit("v22 capability evidence plan mismatch")
          if capability.get("project_reference") != os.environ["AVUHZ_PROJECT_REF"]:
              raise SystemExit("v22 capability evidence project mismatch")
          if capability.get("configuration_digest") != os.environ["AVUHZ_CAPABILITY_REFERENCE_DIGEST"]:
              raise SystemExit("v22 capability configuration digest mismatch")
          if capability.get("result") != "PASS":
              raise SystemExit("v22 capability result mismatch")
          evidence_digest = capability.get("evidence_digest")
          if evidence_digest != os.environ["AVUHZ_CAPABILITY_EVIDENCE_DIGEST"]:
              raise SystemExit("v22 capability evidence digest mismatch")
          body = dict(capability)
          body.pop("evidence_digest", None)
          if canonical_digest(body) != evidence_digest:
              raise SystemExit("v22 capability evidence canonical digest mismatch")
          source = capability.get("source", {})
          if source.get("workflow_run_id") != int(os.environ["AVUHZ_CAPABILITY_RUN_ID"]):
              raise SystemExit("v22 capability run mismatch")
          if source.get("workflow_head_sha") != os.environ["AVUHZ_CAPABILITY_HEAD_SHA"]:
              raise SystemExit("v22 capability head mismatch")
          if source.get("workflow_conclusion") != "success":
              raise SystemExit("v22 capability conclusion mismatch")
          if source.get("provider_mutation_attempted") is not False:
              raise SystemExit("v22 capability unexpectedly attempted mutation")
          if source.get("credential_material_observed_by_control_plane") is not False:
              raise SystemExit("v22 capability exposed credential material")

          print("immutable_v22_authority_verified=true")
          print("v22_capability_evidence_verified=true")
          print("v21_synthetic_identity_evidence_verified=true")
          print("v16_disabled_hook_evidence_verified=true")
          PY

      - name: Verify prior non-secret v22 Auth-admin capability attestation
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_READ_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${AVUHZ_CAPABILITY_RUN_ID}")"; then
            echo "::error::Capability-attestation lookup failed."
            exit 1
          fi

          if [[ "$http_status" != "200" ]]; then
            echo "::error::Capability-attestation lookup did not return HTTP 200."
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              run = json.load(handle)

          expected = {
              "id": int(os.environ["AVUHZ_CAPABILITY_RUN_ID"]),
              "name": "DEVELOPMENT AUTH v22 Admin Capability Certification",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "head_branch": "main",
              "head_sha": os.environ["AVUHZ_CAPABILITY_HEAD_SHA"],
              "path": ".github/workflows/development-auth-v22-admin-capability-certification.yml",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"v22 capability attestation mismatch: {key}")
          PY

          configuration_reference='github-actions://AnonymousKoo/avuhz-infra/.github/workflows/development-auth-v22-admin-capability-certification.yml@main#environment=development;project=pwlhruwutoitnieactol;operation=auth.admin.listUsers'
          observed_digest="sha256:$(printf '%s' "$configuration_reference" | sha256sum | awk '{print $1}')"
          if [[ "$observed_digest" != "${AVUHZ_CAPABILITY_REFERENCE_DIGEST}" ]]; then
            echo "::error::v22 capability reference digest mismatch."
            exit 1
          fi

          echo "auth_admin_executor_capability_attestation_verified=true"
          echo "admin_executor_configuration_reference_digest=${observed_digest}"

      - name: Preflight, bind, and verify exact synthetic tenant metadata
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          now_epoch="$(date -u +%s)"
          window_end_epoch="$(date -u -d "${AVUHZ_WINDOW_END}" +%s)"
          if (( now_epoch >= window_end_epoch )); then
            echo "::error::DEVELOPMENT AUTH v22 authorization expired before provider preflight."
            exit 1
          fi

          before_response="$(mktemp)"
          update_body="$(mktemp)"
          update_response="$(mktemp)"
          get_response="$(mktemp)"
          after_response="$(mktemp)"
          trap 'rm -f "$before_response" "$update_body" "$update_response" "$get_response" "$after_response"' EXIT

          if ! before_status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$before_response" \
            --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_AUTH_ADMIN_EPHEMERAL}" \
            --header "Authorization: Bearer ${SUPABASE_AUTH_ADMIN_EPHEMERAL}" \
            --header 'Accept: application/json' \
            "https://${AVUHZ_PROJECT_REF}.supabase.co/auth/v1/admin/users?page=1&per_page=1000")"; then
            echo "::error::Synthetic tenant-metadata preflight request failed."
            exit 1
          fi

          if [[ "$before_status" != "200" ]]; then
            echo "::error::Synthetic tenant-metadata preflight did not return HTTP 200."
            exit 1
          fi

          target_user_id="$(python3 - "$before_response" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import uuid

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          users = payload.get("users") if isinstance(payload, dict) else None
          if not isinstance(users, list):
              raise SystemExit("unexpected Auth-admin list-users response shape")
          if len(users) != 1:
              raise SystemExit("DEVELOPMENT AUTH user count mismatch; stopping before mutation")

          matches = [user for user in users if user.get("email") == os.environ["AVUHZ_TARGET_EMAIL"]]
          if len(matches) != 1:
              raise SystemExit("synthetic identity match count mismatch; stopping before mutation")
          user = matches[0]
          user_id = user.get("id")
          if not isinstance(user_id, str):
              raise SystemExit("synthetic provider subject is unavailable")
          try:
              uuid.UUID(user_id)
          except ValueError:
              raise SystemExit("synthetic provider subject is not a UUID")
          subject_digest = "sha256:" + hashlib.sha256(user_id.encode("utf-8")).hexdigest()
          if subject_digest != os.environ["AVUHZ_SUBJECT_DIGEST"]:
              raise SystemExit("synthetic provider subject digest mismatch; stopping before mutation")
          if not (user.get("email_confirmed_at") or user.get("confirmed_at")):
              raise SystemExit("synthetic identity is not email-confirmed; stopping before mutation")
          if user.get("user_metadata") != {"email_verified": True}:
              raise SystemExit("synthetic user metadata drift; stopping before mutation")
          if user.get("app_metadata") != {"provider": "email", "providers": ["email"]}:
              raise SystemExit("synthetic app metadata preflight drift; stopping before mutation")
          if user.get("is_anonymous") not in (False, None):
              raise SystemExit("synthetic anonymous state drift; stopping before mutation")
          print(user_id)
          PY
          )"

          if [[ -z "$target_user_id" ]]; then
            echo "::error::Synthetic provider subject was unavailable for bounded mutation."
            exit 1
          fi

          preflight_reference='github-actions://AnonymousKoo/avuhz-infra/.github/workflows/development-auth-v22-tenant-metadata-execution.yml@main#environment=development;project=pwlhruwutoitnieactol;operation=auth.admin.listUsers;target=avuhz-development-synthetic@example.invalid;expected_app_metadata=provider-email-defaults'
          observed_preflight_digest="sha256:$(printf '%s' "$preflight_reference" | sha256sum | awk '{print $1}')"
          if [[ "$observed_preflight_digest" != "${AVUHZ_PREFLIGHT_REFERENCE_DIGEST}" ]]; then
            echo "::error::Tenant-metadata preflight reference digest mismatch."
            exit 1
          fi

          echo "synthetic_identity_count_verified=1"
          echo "synthetic_identity_subject_digest_verified=${AVUHZ_SUBJECT_DIGEST}"
          echo "synthetic_identity_email_confirmation_verified=true"
          echo "synthetic_identity_user_metadata_preflight_verified=true"
          echo "synthetic_identity_app_metadata_preflight_verified=true"
          echo "tenant_metadata_preflight_reference_digest=${observed_preflight_digest}"
          echo "provider_mutation_attempted=false"
          echo "credential_material_observed_by_control_plane=false"

          now_epoch="$(date -u +%s)"
          if (( now_epoch >= window_end_epoch )); then
            echo "::error::DEVELOPMENT AUTH v22 authorization expired before provider mutation."
            exit 1
          fi

          python3 - "$update_body" <<'PY'
          import hashlib
          import json
          import os
          import sys

          app_metadata = {
              "provider": "email",
              "providers": ["email"],
              "avuhz_tenant_id": os.environ["AVUHZ_TENANT_ID"],
          }
          canonical = json.dumps(
              app_metadata,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          observed_digest = "sha256:" + hashlib.sha256(canonical).hexdigest()
          if observed_digest != os.environ["AVUHZ_TARGET_APP_METADATA_DIGEST"]:
              raise SystemExit("target app metadata digest mismatch before mutation")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"app_metadata": app_metadata}, handle, separators=(",", ":"))
          PY

          if ! update_status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$update_response" \
            --write-out '%{http_code}' \
            --request PUT \
            --header "apikey: ${SUPABASE_AUTH_ADMIN_EPHEMERAL}" \
            --header "Authorization: Bearer ${SUPABASE_AUTH_ADMIN_EPHEMERAL}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$update_body" \
            "https://${AVUHZ_PROJECT_REF}.supabase.co/auth/v1/admin/users/${target_user_id}")"; then
            echo "::error::Tenant-metadata update transport failed after the mutation request began; outcome is ambiguous. Do not retry."
            exit 1
          fi

          if [[ "$update_status" != "200" ]]; then
            echo "::error::Tenant-metadata update returned an unexpected HTTP status after the mutation request began; outcome is ambiguous. Do not retry."
            exit 1
          fi

          python3 - "$update_response" "$target_user_id" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              user = json.load(handle)
          if not isinstance(user, dict):
              raise SystemExit("tenant-metadata update response shape is invalid")
          if user.get("id") != sys.argv[2]:
              raise SystemExit("tenant-metadata update provider subject mismatch")
          if user.get("email") != os.environ["AVUHZ_TARGET_EMAIL"]:
              raise SystemExit("tenant-metadata update synthetic email mismatch")
