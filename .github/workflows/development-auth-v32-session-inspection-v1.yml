name: DEVELOPMENT AUTH v32 Session Inspection v1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSPECT_V32_SESSION_STATE_READ_ONLY for this exact read-only boundary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: development-auth-v32-session-inspection-v1
  cancel-in-progress: false

jobs:
  inspect-development-auth-session-state:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development

    env:
      AVUHZ_EXPECTED_PROJECT_REF: pwlhruwutoitnieactol
      AVUHZ_PLAN_ID: 8a1300d3-4bfb-461c-90c4-a22a53a11647
      AVUHZ_PLAN_DIGEST: sha256:c397fc40fe5622047ab38d435ebad57f119a2b7882103ef0d175e39ee0d5bdf1
      AVUHZ_WINDOW_START: '2026-09-18T15:00:00Z'
      AVUHZ_WINDOW_END: '2026-09-18T21:00:00Z'
      AVUHZ_INSPECTION_CONFIRMATION: ${{ inputs.confirmation }}
      AVUHZ_DEVELOPMENT_SUPABASE_PROVIDER_READ_TOKEN: ${{ secrets.AVUHZ_DEVELOPMENT_SUPABASE_PROVIDER_READ_TOKEN }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact read-only inspection authority
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::SESSION_INSPECTION_MAIN_ONLY"
            exit 1
          fi
          if [[ "${AVUHZ_INSPECTION_CONFIRMATION}" != "INSPECT_V32_SESSION_STATE_READ_ONLY" ]]; then
            echo "::error::SESSION_INSPECTION_CONFIRMATION_MISMATCH"
            exit 1
          fi
          if [[ -z "${AVUHZ_DEVELOPMENT_SUPABASE_PROVIDER_READ_TOKEN:-}" ]]; then
            echo "::error::SESSION_INSPECTION_CREDENTIAL_UNAVAILABLE"
            exit 1
          fi

          approval_path="contracts/plans/v1/development-auth-v32-session-inspection-v1.approval.json"
          if [[ ! -f "${approval_path}" ]]; then
            echo "::error::SESSION_INSPECTION_EXACT_OWNER_APPROVAL_ABSENT"
            exit 1
          fi
          if [[ -e contracts/plans/v1/development-auth-v32-session-inspection-v1.execution-progress.json ]] \
             || compgen -G 'contracts/plans/v1/development-auth-v32-session-inspection-v1*.evidence.json' >/dev/null; then
            echo "::error::SESSION_INSPECTION_EXECUTION_ARTIFACT_ALREADY_EXISTS"
            exit 1
          fi

          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "${AVUHZ_WINDOW_START}" +%s)"
          end_epoch="$(date -u -d "${AVUHZ_WINDOW_END}" +%s)"
          if (( now_epoch < start_epoch || now_epoch >= end_epoch )); then
            echo "::error::SESSION_INSPECTION_AUTHORIZATION_WINDOW_INACTIVE"
            exit 1
          fi

      - name: Install pinned authorization dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            'jsonschema==4.10.3'

      - name: Execute one bounded read-only session inspection
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          PYTHONPATH=src:. python3 scripts/development_auth_v32_session_inspection_v1.py
