    - name: Build repository wheel
      id: wheel_build
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        # setuptools writes build/ and egg-info; build from an exact disposable copy.
        # The canonical checkout must remain raw-byte clean, including ignored paths.
        build_source="$RUNNER_TEMP/gate10-build-source"
        mkdir "$build_source"
        cp -a "$GITHUB_WORKSPACE/." "$build_source/"
        cd "$build_source"
        python3 "$RUNNER_TEMP/gate10-integrity.py"
        set -euo pipefail
        wheel_dir="${RUNNER_TEMP}/avuhz-main-pr-gate-wheel"
        mkdir "$wheel_dir"
        python3 -m pip wheel . \
          --no-deps \
          --no-build-isolation \
          --disable-pip-version-check \
          -w "$wheel_dir"

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" wheel_build "$RUNNER_TEMP/gate10-step-output"
    - name: Verify repository wheel contents
      id: wheel_contents
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        python3 - "${RUNNER_TEMP}/avuhz-main-pr-gate-wheel" <<'PY'
        import sys
        import tomllib
        import zipfile
        from pathlib import Path

        root = Path.cwd()
        wheel_dir = Path(sys.argv[1])
        wheels = sorted(wheel_dir.glob("*.whl"))
        if len(wheels) != 1:
            raise SystemExit("exactly one wheel is required")

        project = tomllib.loads((root / "pyproject.toml").read_text())["project"]
        with zipfile.ZipFile(wheels[0]) as archive:
            names = set(archive.namelist())
            metadata_files = sorted(
                name for name in names if name.endswith(".dist-info/METADATA")
            )
            if len(metadata_files) != 1:
                raise SystemExit("exactly one wheel METADATA file is required")
            metadata = {}
            for line in archive.read(metadata_files[0]).decode().splitlines():
                if ":" in line:
                    key, value = line.split(":", 1)
                    metadata[key] = value.strip()

        if metadata.get("Name") != project["name"]:
            raise SystemExit("wheel package Name does not match pyproject.toml")
        if metadata.get("Version") != project["version"]:
            raise SystemExit("wheel package Version does not match pyproject.toml")
        if not any(name.startswith("avuhz_service/") for name in names):
            raise SystemExit("wheel does not include avuhz_service")
        if not any(name.startswith("avuhz_worker/") for name in names):
            raise SystemExit("wheel does not include avuhz_worker")
        print("wheel_content_verification=passed")
        PY

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" wheel_contents "$RUNNER_TEMP/gate10-step-output"
    - name: Check immutable commit diff hygiene
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        # Manual dispatch has no PR base; compare the exact source to its first parent.
        git cat-file -e "$SOURCE_SHA^{commit}"
        git cat-file -e "$SOURCE_SHA^1^{commit}"
        git diff --check "$SOURCE_SHA^1" "$SOURCE_SHA" >/dev/null 2>&1
        python3 "$RUNNER_TEMP/gate10-evidence.py" diff ".github/workflows/gate10-exact-merge-ci.yml"
    - name: Verify final raw checkout integrity
      id: integrity
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        python3 "$RUNNER_TEMP/gate10-integrity.py"
        python3 "$RUNNER_TEMP/gate10-evidence.py" integrity ".github/workflows/gate10-exact-merge-ci.yml"
    - name: Remove disposable PostgreSQL
      id: cleanup
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Disposable PostgreSQL cleanup failed."' ERR
        (
        set -euo pipefail
        command -v docker
        container="$(docker container ls -a \
          --filter "name=^/${AVUHZ_LOCAL_POSTGRES_CONTAINER}$" \
          --format '{{.Names}}')"
        if [[ "$container" == "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" ]]; then
          docker rm -f "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" >/dev/null
          remaining="$(docker container ls -a \
            --filter "name=^/${AVUHZ_LOCAL_POSTGRES_CONTAINER}$" \
            --format '{{.Names}}')"
          test -z "$remaining"
          echo "disposable_postgres_removed=true"
        elif [[ -f "${RUNNER_TEMP}/avuhz-main-pr-gate-postgres-created" ]]; then
          echo "disposable_postgres_already_absent=true"
        else
          echo "disposable_postgres_was_not_created=true"
        fi
        echo "provider_contact_attempted=false"
        echo "supabase_contact_attempted=false"
        echo "remote_mutation_attempted=false"

        ) > "$RUNNER_TEMP/gate10-cleanup-output" 2>&1
        echo "disposable_postgres_cleanup=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" cleanup "$RUNNER_TEMP/gate10-cleanup-output"
    - name: Revalidate exact wheel subject
      id: wheel_subject
      env:
        VERIFIED_WHEEL_SHA256: ${{ steps.wheel_contents.outputs.wheel_sha256 }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PYSUBJECT'
        import hashlib
        import os
        from pathlib import Path
        import re
        import stat

        try:
            expected = os.environ["VERIFIED_WHEEL_SHA256"]
            if not re.fullmatch(r"[0-9a-f]{64}", expected):
                raise ValueError("digest")
            root = Path(os.environ["RUNNER_TEMP"]) / "avuhz-main-pr-gate-wheel"
            # Reject symlinked parents and action glob/output-control characters.
            if (not root.is_absolute() or root.resolve(strict=True) != root
                    or not re.fullmatch(r"/[A-Za-z0-9_./+-]+", str(root))
                    or not stat.S_ISDIR(root.lstat().st_mode)):
                raise ValueError("directory")
            wheels = list(root.iterdir())
            if len(wheels) != 1:
                raise ValueError("count")
            wheel = wheels[0]
            if (not re.fullmatch(r"avuhz_service-[0-9]+(?:\.[0-9]+)*-py3-none-any\.whl", wheel.name)
                    or not stat.S_ISREG(wheel.lstat().st_mode)):
                raise ValueError("wheel")
            fd = os.open(wheel, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
            with os.fdopen(fd, "rb") as stream:
                if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                    raise ValueError("type")
                actual = hashlib.file_digest(stream, "sha256").hexdigest()
            if actual != expected:
                raise ValueError("substitution")
            with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                output.write(f"wheel_path={wheel}\nwheel_sha256={actual}\n")
        except (OSError, ValueError, KeyError):
            raise SystemExit("wheel_subject_verification=failed") from None
        PYSUBJECT
    - name: Upload exact CI wheel for temporary retrieval
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate10-wheel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.wheel_subject.outputs.wheel_path }}
        if-no-files-found: error
        retention-days: 30
    - name: Record non-certified completion
      id: summary
      if: always()
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSUMMARY'
        import json
        import os
        import re

        required = (
            "checkout", "identity", "dependencies", "baseline", "portable", "schema",
            "portability_gap", "postgres", "migrations", "replay", "integrations",
            "wheel_build", "wheel_contents", "diff", "integrity", "cleanup",
            "wheel_subject", "upload",
        )
        try:
            steps = json.loads(os.environ["STEP_RESULTS"])
            if not isinstance(steps, dict):
                steps = {}
        except (ValueError, KeyError):
            steps = {}
        lines = ["evidence_class=non-certified", "provenance=not_independently_verified",
                 "certification_granted=false", "signing_state=pending_separate_job",
                 "cross_repo_suite_portable=false",
                 "scope=LOCAL_TEST_repository_CI", "execution_authority=absent"]
        passed = True
        for stage in required:
            record = steps.get(stage, {})
            if not isinstance(record, dict):
                record = {}
            for field in ("outcome", "conclusion"):
                status = record.get(field)
                if status not in ("success", "failure", "skipped", "cancelled"):
                    status = "missing"
                lines.append(f"{stage}_{field}={status}")
                passed &= status == "success"
            outputs = record.get("outputs", {})
            if not isinstance(outputs, dict):
                outputs = {}
            keys = [] if stage in ("checkout", "wheel_subject", "upload") else ["evidence_sha256"]
            keys += {"identity": ["source_tree_sha256"],
                     "integrity": ["source_tree_sha256"],
                     "wheel_contents": ["wheel_sha256"],
                     "wheel_subject": ["wheel_sha256"],
                     "replay": ["baseline_sha256"]}.get(stage, [])
            for key in keys:
                value = outputs.get(key, "")
                valid = isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value)
                lines.append(f"{stage}_{key}={value if valid else 'missing'}")
                passed &= bool(valid)
            if stage in ("migrations", "integrations"):
                zero = outputs.get("required_skips") == "0"
                lines.append(f"{stage}_required_skips={'0' if zero else 'unverified'}")
                passed &= zero
            if stage == "postgres":
                version = outputs.get("postgres_version_num", "")
                valid = isinstance(version, str) and re.fullmatch(r"17[0-9]{4}", version)
                lines.append(f"postgres_version_num={version if valid else 'unverified'}")
                # This is the pinned image verified by the PostgreSQL step.
                lines.append("postgres_expected_image=docker.io/library/postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94")
                passed &= bool(valid)
        subject = steps.get("wheel_subject", {})
        contents = steps.get("wheel_contents", {})
        subject = subject.get("outputs", {}) if isinstance(subject, dict) else {}
        contents = contents.get("outputs", {}) if isinstance(contents, dict) else {}
        if not isinstance(subject, dict) or not isinstance(contents, dict):
            passed = False
        else:
            passed &= subject.get("wheel_sha256") == contents.get("wheel_sha256")
        upload = steps.get("upload", {})
        upload = upload.get("outputs", {}) if isinstance(upload, dict) else {}
        artifact_id = upload.get("artifact-id", "") if isinstance(upload, dict) else ""
        passed &= isinstance(artifact_id, str) and bool(re.fullmatch(r"[1-9][0-9]*", artifact_id))
        # Bind the sanitized identities only after exact preflight succeeded.
        identity = steps.get("identity", {})
        if isinstance(identity, dict) and identity.get("outcome") == "success":
            for key in ("SOURCE_SHA", "GITHUB_SHA", "WORKFLOW_SHA", "EXPECTED_WORKFLOW_SHA"):
                value = os.environ.get(key, "")
                valid = bool(re.fullmatch(r"[0-9a-f]{40}", value))
                lines.append(f"{key.lower()}={value if valid else 'unverified'}")
                passed &= valid and value == os.environ.get("SOURCE_SHA")
        else:
            passed = False
        initial = steps.get("identity", {})
        final = steps.get("integrity", {})
        initial = initial.get("outputs", {}) if isinstance(initial, dict) else {}
        final = final.get("outputs", {}) if isinstance(final, dict) else {}
        if not isinstance(initial, dict) or not isinstance(final, dict):
            passed = False
        else:
            passed &= initial.get("source_tree_sha256") == final.get("source_tree_sha256")
        lines.append(f"exact_merge_producer_checks={'passed' if passed else 'failed_or_incomplete'}")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("\n".join(lines) + "\n")
        if not passed:
            raise SystemExit("exact_merge_producer_checks=failed_or_incomplete")
