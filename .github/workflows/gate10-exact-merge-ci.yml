# R2 repository-local review candidate ONLY; no dispatch/execution authority.
# One manual lane, first attempt only; a new dispatch is a new authorization boundary.
# Future authorized CI uses runner network for checkout, apt, pip and digest-pinned
# Docker image downloads. No such operations were invoked to author this candidate.
# Preparation invokes no signing or publication. Future separately authorized CI
# requires attestation and temporary artifact upload; neither certifies a release.
# Recipe comparison only (never the checkout or expected merge SHA): git show 047828fe59e743932162df7776fcb37f25647689:.github/workflows/main-pr-gate.yml
name: Gate10 exact merge CI review candidate
'on':
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Reviewed eventual main merge commit SHA; evidence binding only, not authorization
        required: true
        type: string
permissions:
  contents: read
jobs:
  exact-merge-evidence:
    if: >-
      github.repository == 'AnonymousKoo/avuhz-infra' &&
      github.repository_owner == 'AnonymousKoo' && github.repository_owner_id == '168945054' &&
      github.workflow_ref == 'AnonymousKoo/avuhz-infra/.github/workflows/gate10-exact-merge-ci.yml@refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'AnonymousKoo' && github.actor_id == '168945054' &&
      github.run_attempt == 1 &&
      inputs.expected_workflow_sha != '' &&
      inputs.expected_workflow_sha == github.sha &&
      inputs.expected_workflow_sha == github.workflow_sha
    permissions:
      contents: read
    outputs:
      wheel_sha256: ${{ steps.wheel_subject.outputs.wheel_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src:.
      AVUHZ_LOCAL_POSTGRES_CONTAINER: avuhz-main-pr-gate-postgres
      AVUHZ_POSTGRES_IMAGE: docker.io/library/postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      AVUHZ_POSTGRES_DIGEST: sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      AVUHZ_INTEGRATION_DATABASE: avuhz_main_pr_gate
      AVUHZ_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=avuhz_main_pr_gate user=postgres
      SOURCE_SHA: ${{ github.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      PIP_NO_INPUT: '1'
    steps:
    - name: Checkout exact main merge source
      id: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: AnonymousKoo/avuhz-infra
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        clean: true
        submodules: false
        lfs: false
    - name: Verify exact source and record non-certified identity
      id: identity
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$GITHUB_REPOSITORY" = 'AnonymousKoo/avuhz-infra'
        test "$REPOSITORY_OWNER" = 'AnonymousKoo'
        test "$REPOSITORY_OWNER_ID" = '168945054'
        test "$WORKFLOW_REF" = 'AnonymousKoo/avuhz-infra/.github/workflows/gate10-exact-merge-ci.yml@refs/heads/main'
        test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
        test "$GITHUB_RUN_ATTEMPT" = '1'
        test "$GITHUB_REF" = 'refs/heads/main'
        test "$GITHUB_ACTOR" = 'AnonymousKoo'
        test "$GITHUB_ACTOR_ID" = '168945054'
        # Expected SHA must be the eventual reviewed main merge commit, never a baseline PR head.
        # Evidence binding does not grant execution authority.
        # Pass via env, never interpolate dispatch input into shell source or logs.
        [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$EXPECTED_WORKFLOW_SHA" = "$GITHUB_SHA"
        test "$EXPECTED_WORKFLOW_SHA" = "$WORKFLOW_SHA"
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$WORKFLOW_SHA" = "$SOURCE_SHA"
        [[ "$GITHUB_ACTOR" =~ ^[A-Za-z0-9_-]+(\[bot\])?$ ]]
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
        test "$AVUHZ_POSTGRES_DSN" = 'host=127.0.0.1 port=5432 dbname=avuhz_main_pr_gate user=postgres'
        # Never inherit hosted DSNs, libpq services, credentials, or test opt-ins.
        python3 - <<'PYENV'
        import os
        allowed = {
            "AVUHZ_LOCAL_POSTGRES_CONTAINER", "AVUHZ_POSTGRES_IMAGE",
            "AVUHZ_POSTGRES_DIGEST", "AVUHZ_INTEGRATION_DATABASE", "AVUHZ_POSTGRES_DSN",
        }
        if any((k.startswith("AVUHZ_") and k not in allowed)
               or k.startswith(("PG", "SUPABASE_")) for k in os.environ):
            raise SystemExit("unexpected_database_environment")
        PYENV
        cat > "$RUNNER_TEMP/gate10-integrity.py" <<'PYINTEGRITY'
        import hashlib
        import os
        from pathlib import Path
        import stat
        import subprocess


        def git(root, *args, data=None):
            return subprocess.check_output(
                ["git", "-C", str(root), *args], input=data, stderr=subprocess.DEVNULL
            )


        def verify(root, source):
            root = Path(root)
            expected = {}
            directories = set()
            for record in git(root, "ls-tree", "-rz", source).split(b"\0"):
                if not record:
                    continue
                metadata, name = record.split(b"\t", 1)
                mode, kind, oid = metadata.split()
                if kind != b"blob" or mode not in (b"100644", b"100755"):
                    raise ValueError("unsupported_tree_entry")
                path = os.fsdecode(name)
                if path == ".git" or path.startswith(".git/"):
                    raise ValueError("reserved_path")
                expected[path] = (mode, oid)
                directories.update(str(p) for p in Path(path).parents if str(p) != ".")
            staged = {}
            for record in git(root, "ls-files", "--stage", "-z").split(b"\0"):
                if not record:
                    continue
                metadata, name = record.split(b"\t", 1)
                mode, oid, stage = metadata.split()
                if stage != b"0":
                    raise ValueError("unmerged_index")
                staged[os.fsdecode(name)] = (mode, oid)
            if staged != expected:
                raise ValueError("index_mismatch")
            attrs = git(root, "check-attr", "-z", "--stdin", "filter",
                        data=b"\0".join(os.fsencode(p) for p in expected) + b"\0").split(b"\0")
            if any(value not in (b"unspecified", b"unset") for value in attrs[2::3]):
                raise ValueError("filter_attribute")
            seen = set()
            for parent, dirs, files in os.walk(root, followlinks=False):
                for name in list(dirs) + files:
                    path = Path(parent) / name
                    relative = str(path.relative_to(root))
                    # Git administrative metadata is excluded; no other path is excluded.
                    if relative == ".git":
                        if path.is_symlink() or not path.is_dir():
                            raise ValueError("git_metadata_shape")
                        if name in dirs:
                            dirs.remove(name)
                        continue
                    mode = path.lstat().st_mode
                    if stat.S_ISDIR(mode):
                        if relative not in directories:
                            raise ValueError("extra_directory")
                        continue
                    if not stat.S_ISREG(mode) or relative not in expected:
                        raise ValueError("extra_or_special_file")
                    expected_mode, oid = expected[relative]
                    executable = bool(mode & 0o111)
                    if executable != (expected_mode == b"100755"):
                        raise ValueError("file_mode_mismatch")
                    raw = path.read_bytes()
                    # Hash raw bytes, bypassing Git clean/smudge/text filters entirely.
                    digest = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
                    if digest.encode() != oid:
                        raise ValueError("raw_blob_mismatch")
                    seen.add(relative)
            if seen != set(expected):
                raise ValueError("missing_file")
            if git(root, "status", "--porcelain=v1", "--untracked-files=all"):
                raise ValueError("dirty_source")


        if __name__ == "__main__":
            try:
                verify(Path.cwd(), os.environ["SOURCE_SHA"])
            except Exception:
                raise SystemExit("source_integrity=failed") from None
            print("source_integrity=passed; git_metadata_excluded=true")
        PYINTEGRITY
        cat > "$RUNNER_TEMP/gate10-evidence.py" <<'PYEVIDENCE'
        import hashlib
        import os
        from pathlib import Path
        import subprocess
        import sys


        def digest(path):
            total = 0
            result = hashlib.sha256()
            with Path(path).open("rb") as source:
                while chunk := source.read(65536):
                    total += len(chunk)
                    if total > 128 * 1024 * 1024:
                        raise ValueError("evidence_size")
                    result.update(chunk)
            return result.hexdigest()


        try:
            stage, path = sys.argv[1:]
            fields = {"evidence_sha256": digest(path)}
            if stage in ("identity", "integrity"):
                tree = subprocess.check_output(
                    ["git", "ls-tree", "-rz", os.environ["SOURCE_SHA"]],
                    stderr=subprocess.DEVNULL,
                )
                fields["source_tree_sha256"] = hashlib.sha256(tree).hexdigest()
            if stage == "wheel_contents":
                wheels = list((Path(os.environ["RUNNER_TEMP"]) /
                               "avuhz-main-pr-gate-wheel").glob("*.whl"))
                if len(wheels) != 1:
                    raise ValueError("wheel_count")
                fields["wheel_sha256"] = digest(wheels[0])
            if stage == "replay":
                fields["baseline_sha256"] = digest(
                    "supabase/migrations/20260831120000_rebaseline_provider_neutral_avuhz.sql")
            if stage in ("migrations", "integrations"):
                fields["required_skips"] = "0"
            with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                for key, value in fields.items():
                    output.write(f"{key}={value}\n")
        except Exception:
            raise SystemExit("evidence_record=failed") from None
        PYEVIDENCE
        python3 "$RUNNER_TEMP/gate10-integrity.py"
        {
          printf 'evidence_class=non-certified\nprovenance=absent\n'
          printf 'workflow_sha=%s\nsource_sha=%s\n' "$WORKFLOW_SHA" "$SOURCE_SHA"
          printf 'actor=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_ACTOR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          printf 'scope=LOCAL_TEST_repository_CI\nexecution_authority=absent\n'
        } > "$RUNNER_TEMP/gate10-identity-output"
        python3 "$RUNNER_TEMP/gate10-evidence.py" identity "$RUNNER_TEMP/gate10-identity-output"
    - name: Install pinned local validation dependencies
      id: dependencies
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail

        command -v git
        command -v bash
        command -v python3
        command -v jq
        command -v docker

        python3 - <<'PY'
        import sys
        if sys.version_info < (3, 11):
            raise SystemExit("Python 3.11 or newer is required")
        print(sys.version.split()[0])
        PY

        sudo apt-get update
        sudo apt-get install --yes ripgrep
        command -v rg
        rg --version

        constraints="${RUNNER_TEMP}/avuhz-main-pr-gate-constraints.txt"
        cat > "$constraints" <<'CONSTRAINTS'
        semgrep==1.136.0
        setuptools==68.1.2
        jsonschema==4.10.3
        psycopg==3.3.4
        psycopg-binary==3.3.4
        PyJWT==2.14.0
        cryptography==50.0.1
        boltons==21.0.0
        bracex==3.0.1
        click==8.1.8
        click-option-group==0.5.9
        defusedxml==0.7.1
        deprecated==1.3.1
        exceptiongroup==1.2.2
        face==26.0.1
        glom==22.1.0
        googleapis-common-protos==1.75.0
        importlib-metadata==7.1.0
        opentelemetry-api==1.25.0
        opentelemetry-exporter-otlp-proto-common==1.25.0
        opentelemetry-exporter-otlp-proto-http==1.25.0
        opentelemetry-instrumentation==0.46b0
        opentelemetry-instrumentation-requests==0.46b0
        opentelemetry-proto==1.25.0
        opentelemetry-sdk==1.25.0
        opentelemetry-semantic-conventions==0.46b0
        opentelemetry-util-http==0.46b0
        peewee==3.19.0
        protobuf==4.25.9
        rich==13.5.3
        ruamel.yaml==0.19.1
        tomli==2.0.2
        wcmatch==8.5.2
        wrapt==1.17.3
        zipp==4.1.0
        CONSTRAINTS

        python3 -m pip install --disable-pip-version-check --no-input \
          --constraint "$constraints" \
          setuptools==68.1.2 \
          jsonschema==4.10.3 \
          psycopg==3.3.4 \
          psycopg-binary==3.3.4 \
          'PyJWT[crypto]==2.14.0' \
          cryptography==50.0.1 \
          semgrep==1.136.0
        python3 -m pip install --disable-pip-version-check --no-input \
          --require-hashes --only-binary=:all: --force-reinstall \
          -r requirements/local-v1-validation.lock
        python3 -m pip check

        python3 - <<'PY'
        from importlib.metadata import version

        expected = {
            "setuptools": "68.1.2",
            "jsonschema": "4.10.3",
            "psycopg": "3.3.4",
            "psycopg-binary": "3.3.4",
            "PyJWT": "2.14.0",
            "cryptography": "50.0.1",
            "semgrep": "1.136.0",
        }
        for package, required in expected.items():
            installed = version(package)
            print(f"{package}=={installed}")
            if installed != required:
                raise SystemExit(f"{package} does not match the pinned version")
        PY

        command -v semgrep
        test "$(semgrep --version | tail -n1)" = "1.136.0"
        for tool in git bash python3 jq docker rg semgrep; do
          command -v "$tool"
        done

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" dependencies "$RUNNER_TEMP/gate10-step-output"
    - name: Run canonical repository baseline
      id: baseline
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        bash ./scripts/check-baseline.sh

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" baseline "$RUNNER_TEMP/gate10-step-output"
    - name: Run portable repository unit suites
      id: portable
      shell: bash
      run: |
        set -euo pipefail
        (
        set -euo pipefail
        # Diagnostic state is local, never inherited from the runner environment.
        portable_suite=unknown
        exec 3>&1
        portable_failure() {
          status=$?
          case "$portable_suite" in
            runtime) printf 'gate10_portable_failed_suite=runtime\n' >&3 ;;
            service) printf 'gate10_portable_failed_suite=service\n' >&3 ;;
            worker) printf 'gate10_portable_failed_suite=worker\n' >&3 ;;
            architecture) printf 'gate10_portable_failed_suite=architecture\n' >&3 ;;
            engineering) printf 'gate10_portable_failed_suite=engineering\n' >&3 ;;
            security) printf 'gate10_portable_failed_suite=security\n' >&3 ;;
            *) printf 'gate10_portable_failed_suite=unknown\n' >&3 ;;
          esac
          exit "$status"
        }
        trap portable_failure ERR
        # Keep shell/redirection errors private as well as raw unittest output.
        {
        {
        portable_suite=runtime
        printf 'gate10_portable_stage=runtime\n' >&3
        python3 -m unittest discover -s tests/runtime -p 'test_*.py' -v
        portable_suite=service
        printf 'gate10_portable_stage=service\n' >&3
        python3 -m unittest discover -s tests/service -p 'test_*.py' -v
        portable_suite=worker
        printf 'gate10_portable_stage=worker\n' >&3
        python3 -m unittest discover -s tests/worker -p 'test_*.py' -v
        portable_suite=architecture
        printf 'gate10_portable_stage=architecture\n' >&3
        python3 -m unittest discover -s tests/architecture -p 'test_*.py' -v
        portable_suite=engineering
        printf 'gate10_portable_stage=engineering\n' >&3
        python3 -m unittest discover -s tests/engineering -p 'test_*.py' -v
        portable_suite=security
        printf 'gate10_portable_stage=security\n' >&3
        python3 -m unittest discover -s tests/security -p 'test_*.py' -v

        } > "$RUNNER_TEMP/gate10-step-output" 2>&1
        } 2>/dev/null
        )
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" portable "$RUNNER_TEMP/gate10-step-output"
    - name: Validate runtime schema representability
      id: schema
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        python3 tests/schema/validate_runtime_schema_representability.py

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" schema "$RUNNER_TEMP/gate10-step-output"
    - name: Record cross-repository portability gap
      id: portability_gap
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        test -f tests/cross_repo/test_sekinfra_handoff.py
        echo "cross_repo_suite_included=false"
        echo "cross_repo_suite_portable=false"

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" portability_gap "$RUNNER_TEMP/gate10-step-output"
    - name: Start stable disposable PostgreSQL 17
      id: postgres
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail

        docker pull "${AVUHZ_POSTGRES_IMAGE}"
        repo_digests="$(docker image inspect "${AVUHZ_POSTGRES_IMAGE}" --format '{{json .RepoDigests}}')"
        python3 - "$repo_digests" "${AVUHZ_POSTGRES_DIGEST}" <<'PY'
        import json
        import sys

        repo_digests = json.loads(sys.argv[1])
        expected = sys.argv[2]
        if not any(item.endswith("@" + expected) for item in repo_digests):
            raise SystemExit("PostgreSQL RepoDigests do not contain the required digest")
        PY

        docker run --detach --rm \
          --name "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
          --env POSTGRES_HOST_AUTH_METHOD=trust \
          --publish 127.0.0.1:5432:5432 \
          "${AVUHZ_POSTGRES_IMAGE}"
        touch "${RUNNER_TEMP}/avuhz-main-pr-gate-postgres-created"

        ready=false
        consecutive_successes=0
        stable_postmaster_start=""
        for _ in $(seq 1 60); do
          if postmaster_start="$(docker exec "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
            psql -X -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
            -c 'select pg_postmaster_start_time();' 2>/dev/null)"; then
            if [[ -n "$postmaster_start" && "$postmaster_start" == "$stable_postmaster_start" ]]; then
              consecutive_successes=$((consecutive_successes + 1))
            else
              stable_postmaster_start="$postmaster_start"
              consecutive_successes=1
            fi
            if (( consecutive_successes >= 3 )); then
              ready=true
              break
            fi
          else
            consecutive_successes=0
            stable_postmaster_start=""
          fi
          sleep 1
        done

        if [[ "$ready" != "true" ]]; then
          echo "::error::Disposable PostgreSQL 17 did not reach stable readiness."
          exit 1
        fi

        docker exec "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
          psql -X -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
          -c 'select version();'
        server_version_num="$(docker exec "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
          psql -X -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
          -c 'show server_version_num;')"
        case "$server_version_num" in
          17*) ;;
          *) echo "::error::Disposable PostgreSQL major version is not 17."; exit 1 ;;
        esac
        echo "disposable_postgres_ready=true"

        [[ "$server_version_num" =~ ^17[0-9]{4}$ ]]
        printf 'postgres_version_num=%s\n' "$server_version_num" >> "$GITHUB_OUTPUT"

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" postgres "$RUNNER_TEMP/gate10-step-output"
    - name: Run PostgreSQL migration suites
      id: migrations
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        output="${RUNNER_TEMP}/avuhz-main-pr-gate-migration-tests.txt"
        python3 -m unittest discover \
          -s tests/migrations \
          -p 'test_*.py' \
          -v 2>&1 | tee "$output"
        if grep -Eiq 'skipped=[1-9][0-9]*|[.][.][.] skipped ' "$output"; then
          echo "::error::A PostgreSQL migration test was skipped."
          exit 1
        fi
        echo "postgres_migration_tests_skipped=false"

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" migrations "$RUNNER_TEMP/gate10-step-output"
    - name: Replay provider-neutral baseline locally
      id: replay
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        docker exec "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
          dropdb --if-exists -U postgres "${AVUHZ_INTEGRATION_DATABASE}"
        docker exec "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
          createdb -U postgres "${AVUHZ_INTEGRATION_DATABASE}"
        docker exec -i "${AVUHZ_LOCAL_POSTGRES_CONTAINER}" \
          psql -X -v ON_ERROR_STOP=1 -U postgres -d "${AVUHZ_INTEGRATION_DATABASE}" \
          < supabase/migrations/20260831120000_rebaseline_provider_neutral_avuhz.sql
        echo "provider_neutral_baseline_replayed_locally=true"

        ) > "$RUNNER_TEMP/gate10-step-output" 2>&1
        echo "historical_check=passed"
        python3 "$RUNNER_TEMP/gate10-evidence.py" replay "$RUNNER_TEMP/gate10-step-output"
    - name: Run disposable PostgreSQL integration suites
      id: integrations
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical CI check failed; raw output withheld."' ERR
        (
        set -euo pipefail
        output="${RUNNER_TEMP}/avuhz-main-pr-gate-integration-tests.txt"
        AVUHZ_RUN_UNIFIED_LOCAL_ACCEPTANCE_PG=1 \
        AVUHZ_REQUIRE_UNIFIED_LOCAL_ACCEPTANCE=1 \
        python3 -m unittest discover \
          -s tests/integration \
          -p 'test_*.py' \
          -v 2>&1 | tee "$output"
        if grep -Eiq 'skipped=[1-9][0-9]*|[.][.][.] skipped ' "$output"; then
          echo "::error::A PostgreSQL integration test was skipped."
          exit 1
        fi
        echo "postgres_integration_tests_skipped=false"

