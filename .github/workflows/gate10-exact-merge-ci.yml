        from pathlib import Path
        import re
        def verify_context():
            exact = {
                "GITHUB_REPOSITORY": "AnonymousKoo/avuhz-infra",
                "REPOSITORY_OWNER": "AnonymousKoo", "REPOSITORY_OWNER_ID": "168945054",
                "WORKFLOW_REF": "AnonymousKoo/avuhz-infra/.github/workflows/gate10-exact-merge-ci.yml@refs/heads/main",
                "GITHUB_EVENT_NAME": "workflow_dispatch", "GITHUB_REF": "refs/heads/main",
                "GITHUB_ACTOR": "AnonymousKoo", "GITHUB_ACTOR_ID": "168945054",
                "GITHUB_RUN_ATTEMPT": "1", "PRODUCER_RESULT": "success",
            }
            if any(os.environ.get(k) != v for k, v in exact.items()):
                raise ValueError("context")
            sha = os.environ["GITHUB_SHA"]
            if not re.fullmatch(r"[0-9a-f]{40}", sha):
                raise ValueError("source")
            if any(os.environ.get(k) != sha for k in
                   ("SOURCE_SHA", "WORKFLOW_SHA", "EXPECTED_WORKFLOW_SHA")):
                raise ValueError("pin")
            if not re.fullmatch(r"[1-9][0-9]*", os.environ["GITHUB_RUN_ID"]):
                raise ValueError("run")
            if not re.fullmatch(r"[1-9][0-9]*", os.environ["ARTIFACT_ID"]):
