            if not re.fullmatch(r"[0-9a-f]{64}", os.environ["VERIFIED_WHEEL_SHA256"]):
                raise ValueError("digest")
            temp = Path(os.environ["RUNNER_TEMP"])
            root = Path(os.environ["DOWNLOAD_PATH"])
            if (not temp.is_absolute() or temp.resolve(strict=True) != temp
                    or not re.fullmatch(r"/[A-Za-z0-9_./+-]+", str(temp))
                    or root != temp / "gate10-signer-wheel"):
                raise ValueError("path")
            return root

        try:
            root = verify_context()
            if root.exists() or root.is_symlink():
                raise ValueError("preexisting_download")
            root.mkdir(mode=0o700)
        except (OSError, ValueError, KeyError):
            raise SystemExit("signer_context=failed") from None
