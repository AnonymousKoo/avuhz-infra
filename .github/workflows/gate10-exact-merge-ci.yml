  # Dedicated hosted signer: no checkout, dependencies, or artifact code execution.
  # actions/attest v4 publishes artifact metadata; its documented permission is
  # artifact-metadata: write. Keep it confined to this signer alongside OIDC.
  attest-exact-wheel:
    needs:
    - exact-merge-evidence
    if: >-
      github.repository == 'AnonymousKoo/avuhz-infra' &&
      github.repository_owner == 'AnonymousKoo' && github.repository_owner_id == '168945054'
      &&
      github.workflow_ref == 'AnonymousKoo/avuhz-infra/.github/workflows/gate10-exact-merge-ci.yml@refs/heads/main'
