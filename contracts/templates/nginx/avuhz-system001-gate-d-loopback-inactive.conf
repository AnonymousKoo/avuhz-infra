# INACTIVE SOURCE TEMPLATE. Do not install or include without fresh exact approval.
# LOCAL/TEST System #001 Gate D: one loopback TLS edge to the existing n8n port.
server {
    listen 127.0.0.1:443 ssl;
    server_name avuhz-gate-d.test;

    server_tokens off;
    access_log off;

    # References only. Certificate and key material are never stored in source.
    ssl_certificate /etc/avuhz/private/avuhz-gate-d.test.crt;
    ssl_certificate_key /etc/avuhz/private/avuhz-gate-d.test.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 4k;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    send_timeout 5s;

    # A request for another virtual host must never reach n8n.
    if ($host != avuhz-gate-d.test) {
        return 421;
    }

    location = /webhook/avuhz-events {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:5678;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_request_buffering on;
        proxy_redirect off;
        proxy_intercept_errors on;
        error_page 300 301 302 303 304 305 306 307 308 =502 @upstream_redirect_denied;
    }

    # Includes n8n UI, admin, API, health, root, webhook-test and all other paths.
    location / {
        deny all;
    }

    location @upstream_redirect_denied {
        internal;
        return 502;
    }
}
