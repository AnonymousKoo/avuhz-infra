[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avuhz-service"
version = "0.1.0"
description = "Provider-neutral governed Avuhz command/query service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.10.3",
  "psycopg[binary]==3.3.4",
]

[project.scripts]
avuhz-service = "avuhz_service.__main__:main"
avuhz-service-development = "avuhz_service.development:main"

[tool.setuptools]
packages = ["avuhz_engineering", "avuhz_runtime", "avuhz_service", "avuhz_worker", "avuhz_contracts"]
package-dir = {"" = "src", "avuhz_contracts" = "contracts"}

[tool.setuptools.package-data]
avuhz_contracts = ["schemas/v1/*/*.json"]
